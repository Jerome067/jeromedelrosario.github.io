<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NutriLens · Nutrition label scanner</title>
  <meta name="description" content="Scan nutrition labels and ingredient lists, understand them in plain language, and track your daily intake against personal targets.">
  <meta name="theme-color" content="#3d8b68">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#today" aria-label="NutriLens home">
      <img src="icon.svg" alt="" width="30" height="30">
      <span>NutriLens</span>
    </a>
    <a class="back" href="../#projects">← Portfolio</a>
    <span id="streak" class="streak" hidden></span>
    <nav class="nav" aria-label="Main">
      <a href="#today" data-nav="today">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
        <span>Today</span>
      </a>
      <button class="nav-scan" data-action="scan-camera" data-target="label" aria-label="Scan a nutrition label">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span>Scan</span>
      </button>
      <a href="#profile" data-nav="profile">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Profile</span>
      </a>
    </nav>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <!-- capture="environment" opens the rear camera directly on phones; desktops get a file picker -->
  <input id="in-camera" type="file" accept="image/*" capture="environment" hidden>
  <input id="in-file" type="file" accept="image/*" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="disclaimer">NutriLens needs JavaScript to read labels on your device.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
